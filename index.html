    <!-- 링크 공유 카드: 이미지 없이 제목·설명만 뜨게 한다.

         (기존 이미지는 Lovable(gpt-engineer) 스토리지를 가리키고 있었다 — 이관 잔재라 함께 제거)
         twitter:card도 summary_large_image는 이미지 전제이므로 summary로 낮춘다. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="AI 기반 한·중 통번역 학습 워크플로우">
    <meta property="og:description" content="AI-mediated L2 pragmatic based 한·중 통번역 학습 워크플로우">

    <meta name="twitter:title" content="AI 기반 한·중 통번역 학습 워크플로우">
