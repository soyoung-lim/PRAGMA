<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRAGMA | AI 기반 한·중 통번역 학습</title>
    <meta name="description" content="한·중 통번역 과정에서 여러 표현을 비교하고, AI 피드백을 바탕으로 관계와 상황에 맞는 표현을 다듬는 수업 플랫폼입니다.">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 중국어(간체) 전용 서체. Pretendard에는 한자 글리프가 없어 지정하지 않으면
         Windows 기본 SimSun(宋体)으로 폴백해 예문 가독성이 크게 떨어진다.
         논문 조판(Noto Serif KR + SC 2층)의 중국어 쪽과 같은 서체를 쓴다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap" />

    <!-- 링크 공유 카드: 이미지 없이 제목·설명만 뜨게 한다.
         og:image / twitter:image를 넣지 않아야 카톡·슬랙이 썸네일을 만들지 않는다.
         (기존 이미지는 Lovable(gpt-engineer) 스토리지를 가리키고 있었다 — 이관 잔재라 함께 제거)
         twitter:card도 summary_large_image는 이미지 전제이므로 summary로 낮춘다. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="PRAGMA | AI 기반 한·중 통번역 학습">
    <meta property="og:description" content="한·중 통번역 과정에서 여러 표현을 비교하고, AI 피드백을 바탕으로 관계와 상황에 맞는 표현을 다듬는 수업 플랫폼입니다.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="PRAGMA | AI 기반 한·중 통번역 학습">
    <meta name="twitter:description" content="한·중 통번역 과정에서 여러 표현을 비교하고, AI 피드백을 바탕으로 관계와 상황에 맞는 표현을 다듬는 수업 플랫폼입니다.">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
