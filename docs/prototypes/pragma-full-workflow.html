<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRAGMA · 전체 학습자 워크플로우 프로토타입</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!--
  전체 워크플로우 정적 프로토타입 — 여정 맵으로 전 화면(온보딩→진단→홈→미션(+전이)→주간리포트, 전략지도) 둘러보기.
  기준: 확정 MD(0719-1050) > 전체설계 조립도(0719) > v2 슬라이스 목업(미션 흐름 이식) > v3.5.1(디자인).
  승인된 결정: 최소 허브+바로시작 / 진단 3개(요청·거절) / 리포트 5회·7일 / CS 2~3개당 1회 주기 삽입.
-->
<style>
:root{
  --paper:#FAF8F2; --ink:#15202B; --ink-soft:#5C6A7A; --line:#D3D1C7;
  --surface:#F5F5F2; --surface-2:#FAFAF7;
  --accent:#FAD338; --accent-soft:#FFF8DE;
  --info:#2563EB; --info-bg:#EFF4FB;
  --ok:#2E7D5B; --warn:#B8860B; --danger:#C42B2B; --danger-soft:#FBEEEE;
  --wx:#95EC69; --wx-bg:#EDEDED;
  --r:12px;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --zh:'Pretendard Variable',Pretendard,'PingFang SC','Microsoft YaHei','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-weight:700;letter-spacing:-0.01em}

header{position:sticky;top:0;z-index:100;background:#15202B;padding:11px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.brand .seal{width:5px;height:26px;border-radius:99px;background:var(--accent)}
.brand b{font-size:15px;font-weight:600;color:#F1EFE8}
.brand small{display:block;color:#8899A6;font-size:11px}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;gap:2px;margin-left:auto}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:#8899A6}
.seg button:hover{color:#F1EFE8}
.seg button.on{background:var(--accent);color:#15202B;font-weight:600}

/* 여정 맵 — 전체 워크플로우 시각화 + 화면 라우터 */
.jmap{background:#1B2836;border-bottom:0.5px solid #2A3B4C;padding:12px 22px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:sticky;top:52px;z-index:99}
.jmap .node{display:flex;align-items:center;gap:6px}
.jmap button{border:0.5px solid #35485C;background:#22303E;color:#AEBCC8;border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:500}
.jmap button:hover{background:#2A3B4C;color:#F1EFE8}
.jmap button.on{background:var(--accent);border-color:var(--accent);color:#15202B;font-weight:700}
.jmap .arr{color:#4A5D70;font-size:13px}
.jmap .sub{font-size:11px;color:#6E8095;margin-left:4px}

.wrap{max-width:720px;margin:0 auto;padding:24px 20px 90px}
.scr-tag{font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;font-weight:600}
.scr-tag b{color:var(--warn)}

.card{background:#fff;border:0.5px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.eyebrow{font-size:12px;font-weight:700;color:var(--warn);letter-spacing:.02em;margin-bottom:6px}
.card h2{font-size:19px;margin-bottom:6px}
.card h3{font-size:15px;margin-bottom:8px}
.lead{font-size:14px;color:var(--ink-soft);margin-bottom:16px}

.prog{display:flex;gap:6px;margin-bottom:22px}
.prog .st{flex:1;text-align:center}
.prog .dot{height:5px;border-radius:99px;background:var(--line)}
.prog .st.done .dot,.prog .st.on .dot{background:var(--accent)}
.prog .lb{font-size:10.5px;color:var(--ink-soft);margin-top:6px;font-weight:500}
.prog .st.on .lb{color:var(--ink);font-weight:700}

.wx{background:var(--wx-bg);border-radius:12px;padding:14px;border:0.5px solid var(--line)}
.wx-top{text-align:center;font-size:12px;color:#7a7a7a;margin-bottom:12px;font-weight:600}
.bubble{max-width:80%;padding:9px 12px;border-radius:9px;font-size:14.5px;margin-bottom:9px;line-height:1.5}
.bubble.them{background:#fff;border-top-left-radius:2px}
.bubble.me{background:var(--wx);margin-left:auto;border-top-right-radius:2px}
.bubble .who{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:2px}

.srcbox{background:var(--surface);border:0.5px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 15px;margin:14px 0;font-size:15px}
.srcbox b{font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:3px;font-weight:600}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opts button{text-align:left;border:0.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;font-size:14px;color:var(--ink)}
.opts button:hover{background:var(--surface-2)}
.opts button.sel{border:1.5px solid var(--ink);background:var(--surface-2);font-weight:600}
.q{font-size:14.5px;font-weight:600;margin-top:16px}
.microfb{font-size:12.5px;color:var(--ok);margin-top:10px;font-weight:600}

textarea{width:100%;border:0.5px solid var(--line);border-radius:10px;padding:12px;font-size:15.5px;font-family:var(--zh);min-height:82px;resize:vertical;background:#fff;line-height:1.6}
textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.thint{font-size:12px;color:var(--ink-soft);margin-top:8px}

.recv{border:0.5px solid var(--line);border-left:3px solid var(--info);background:var(--info-bg);border-radius:0 10px 10px 0;padding:12px 15px;margin-bottom:14px;font-size:13.5px;line-height:1.6}
.recv b{font-size:11.5px;color:var(--info);display:block;margin-bottom:5px;font-weight:700}
.recv span{display:block;margin:3px 0}
.fidcheck{font-size:13px;color:var(--ink-soft);background:var(--surface);border:0.5px solid var(--line);border-radius:8px;padding:9px 13px;margin-bottom:16px}

.cand{border:0.5px solid var(--line);border-radius:10px;padding:12px 15px;margin-bottom:10px}
.cand.mine{background:var(--surface-2)}
.cand.good{border-color:var(--ok)}
.cand.edge{border-color:var(--danger);background:var(--danger-soft)}
.cand .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;margin-bottom:8px}
.cand.mine .tag{background:var(--surface);color:var(--ink-soft)}
.cand.good .tag{background:#E8F3EE;color:var(--ok)}
.cand.edge .tag{background:#F7DCDC;color:var(--danger)}
.cand .zh{font-family:var(--zh);font-size:15px;line-height:1.6}
.feat{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.feat span{font-size:11px;background:var(--accent-soft);border:0.5px solid var(--accent);border-radius:99px;padding:2px 9px;color:#6B5518}
.feat.bad span{background:var(--danger-soft);border-color:#E7B7B7;color:var(--danger)}

.fixnote{background:var(--accent-soft);border:0.5px solid var(--accent);border-radius:10px;padding:12px 15px;margin-bottom:14px;font-size:14px}
.fixnote b{display:block;font-size:12px;color:#6B5518;margin-bottom:4px;font-weight:700}
.csbox{border:0.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 15px;margin-bottom:14px;font-size:14px}
.csbox b{color:#6B5518}

.principle{border:0.5px solid var(--line);border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:15px 18px;margin-bottom:16px}
.principle .k{display:inline-block;font-size:11px;font-weight:700;background:var(--accent);color:#15202B;border-radius:99px;padding:2px 10px;margin-bottom:10px}
.principle .row{margin:7px 0}
.principle .row b{font-size:11.5px;color:var(--ink-soft);display:block;font-weight:600}
.principle .row .v{font-size:14px}
.principle .row .v .zh{font-family:var(--zh)}
.verdict{display:inline-flex;gap:7px;font-size:13px;font-weight:700;border-radius:99px;padding:6px 14px;margin-bottom:14px;background:var(--accent-soft);color:var(--warn);border:0.5px solid var(--accent)}

/* 홈/허브 */
.hero{background:var(--ink);color:#fff;border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.hero .k{font-size:11.5px;color:var(--accent);font-weight:700;margin-bottom:6px}
.hero h2{color:#fff;font-size:20px;margin-bottom:4px}
.hero p{font-size:13.5px;color:#B9C4CE}
.hero .go{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.tile{border:0.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff}
.tile .tk{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:4px}
.tile .tv{font-size:14.5px}
.tile.link{cursor:pointer}.tile.link:hover{background:var(--surface-2)}

/* 전략 지도 */
.strat{border:0.5px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px}
.strat b{font-size:13.5px}
.strat .zh{font-family:var(--zh);color:var(--ink-soft)}
.strat .cond{font-size:12px;color:var(--ink-soft);margin-top:2px}
.gate-note{font-size:12px;color:#6B5518;background:var(--accent-soft);border:0.5px solid var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:14px}

/* 리포트 */
.gauge{height:12px;background:var(--surface);border-radius:99px;overflow:hidden;margin:6px 0}
.gauge i{display:block;height:100%;background:var(--accent)}
.metric{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.actbar{font-size:14px}.actbar .dots{letter-spacing:2px;font-size:15px}
.chip{display:inline-block;font-size:12px;background:var(--surface);border:0.5px solid var(--line);border-radius:99px;padding:3px 11px;margin:3px 4px 0 0;font-family:var(--zh)}
.evgrade{font-size:11.5px;color:var(--ink-soft);background:var(--surface);border-radius:99px;padding:2px 10px;display:inline-block}
.challenge{border:0.5px solid var(--danger);background:var(--danger-soft);border-radius:10px;padding:12px 15px;margin-top:12px;font-size:13.5px}
.challenge b{color:var(--danger)}

/* 레슨 아크 (L1~L4) */
.arc-prog{display:flex;gap:6px;margin-bottom:18px}
.arc-prog span{flex:1;text-align:center;font-size:11px;color:var(--ink-soft);padding-top:8px;border-top:3px solid var(--line)}
.arc-prog span.on{color:var(--ink);font-weight:700;border-top-color:var(--accent)}
.arc-prog span.done{border-top-color:var(--accent)}
.scene{background:#1B2836;border-radius:12px;padding:16px 18px;color:#DDE4EA;font-size:14.5px;line-height:1.8}
.scene .dir{color:#8899A6;font-size:12.5px;font-style:italic}
.scene .zh{font-family:var(--zh);color:#fff}
.scene .frz{color:#FF9C9C;font-weight:700}
.clue{border-bottom:2px dotted var(--warn);cursor:pointer;font-family:var(--zh)}
.clue:hover{background:var(--accent-soft)}
.clue.found{background:var(--accent);border-bottom:none;border-radius:3px;padding:0 2px}
.clue-count{display:inline-block;font-size:12px;font-weight:700;background:var(--ink);color:#fff;border-radius:99px;padding:3px 12px;margin-top:12px}
.pdr-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0}
.pdr-table th,.pdr-table td{border:0.5px solid var(--line);padding:8px 12px;text-align:left}
.pdr-table th{background:var(--surface);font-size:12px;width:110px}
.pdr-table .hi{background:var(--accent-soft);font-weight:600}
.unlock{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:0.5px solid var(--accent);border-radius:10px;padding:11px 15px;margin-top:14px;font-size:13.5px;font-weight:600}
.game-opt{border:0.5px solid var(--line);border-radius:10px;padding:12px 15px;margin-bottom:9px;cursor:pointer;font-family:var(--zh);font-size:15px;background:#fff}
.game-opt:hover{background:var(--surface-2)}
.game-opt.pick-right{border:1.5px solid var(--ok);background:#F0F8F4}
.game-opt.pick-wrong{border:1.5px solid var(--danger);background:var(--danger-soft)}
.game-fb{font-size:13px;margin-top:4px;font-weight:600}
/* 슬라이드(온보딩) */
.slide{min-height:150px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--accent);width:18px}

.btn{border:none;background:var(--ink);color:#fff;border-radius:10px;padding:11px 20px;font-size:14.5px;font-weight:600}
.btn:hover{background:#22303E}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.acc{background:var(--accent);color:#15202B}
.btn.acc:hover{background:#F6C200}
.btn.ghost{background:#fff;border:0.5px solid var(--line);color:var(--ink-soft);font-weight:500}
.btn.ghost:hover{background:var(--surface);color:var(--ink)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.nav .sp{flex:1}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="seal"></span><div><b>PRAGMA</b><small>전체 학습자 워크플로우 · 정적 프로토타입</small></div></div>
  <div class="seg" id="modeSeg">
    <button data-m="self">자율</button>
    <button data-m="class">수업연계</button>
  </div>
</header>

<!-- 여정 맵 = 전체 워크플로우 시각화 + 라우터 -->
<nav class="jmap" id="jmap">
  <div class="node"><button data-v="onboarding">온보딩</button></div><span class="arr">→</span>
  <div class="node"><button data-v="diagnostic">진단</button></div><span class="arr">→</span>
  <div class="node"><button data-v="home">홈 / 허브</button></div><span class="arr">⇄</span>
  <div class="node"><button data-v="lesson">특징 도입 <span class="sub">(아크)</span></button></div><span class="arr">→</span>
  <div class="node"><button data-v="mission">미션 <span class="sub">(+전이)</span></button></div><span class="arr">→</span>
  <div class="node"><button data-v="report">주간 리포트</button></div>
  <span class="arr" style="margin-left:8px">·</span>
  <div class="node"><button data-v="strategy">전략 지도</button></div>
</nav>

<div class="wrap" id="app"></div>

<script>
const M = {
  ctx:{ partner:'샤오린(小林)', rel:'이번 학기 처음 같은 조가 된 중국인 동급생 (아직 조금 어색)' },
  srcKo:'샤오린, 혹시 발표 자료 마감을 하루만 미뤄도 괜찮을까? 내 파트 정리가 좀 늦어져서… 안 되면 편하게 말해줘!',
  demoDraft:'小林，发表资料的截止日期能推迟一天吗？我这部分整理得有点慢。',
  mSteps:['상황 읽기','해보기','차이 발견','한 곳 고치기','전이','마무리'],
};
let S = { view:'onboarding', mode:'self', onb:0, m:0, sel:null, draft:'', revised:'', cs:'', level:'intermediate',
  arc:0, clues:[], cls:{} };

const $=s=>document.querySelector(s);
const app=()=>$('#app');
function go(v){ S.view=v; if(v==='mission')S.m=0; render(); }
window.go=go;

function render(){
  document.querySelectorAll('#jmap button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
  ({onboarding:vOnb, diagnostic:vDiag, home:vHome, lesson:vLesson, mission:vMission, strategy:vStrat, report:vReport}[S.view])();
}

/* ── S0 온보딩 ── */
function vOnb(){
  const slides=[
    {e:'온보딩 · 1/3', h:'화용적 적절성이란?', b:`문법이 맞아도 <b>상황에 안 맞으면</b> 관계가 어색해져요. 이 앱은 "무엇이 문법적으로 맞는가"가 아니라 <b>"이 상황에 무엇이 어울리는가"</b>를 연습합니다. 정답은 하나가 아니라 <b>상황의 함수</b>예요.`},
    {e:'온보딩 · 2/3', h:'표현을 바꾸는 세 가지', b:`같은 부탁도 이 세 가지에 따라 달라져요 — <b>상대가 나보다 윗사람인가</b>(권력) · <b>얼마나 가까운가</b>(거리) · <b>부탁이 얼마나 부담스러운가</b>(부담). 앱은 이 감각을 매 미션에서 길러줍니다.`},
    {e:'온보딩 · 3/3', h:'매체마다 말투가 달라요', b:`같은 뜻도 <b>위챗 ↔ 이메일 ↔ 공문서</b>에서 말투가 달라집니다. 한국 학습자는 위챗에도 딱딱한 서면투(인민일보투)를 쓰기 쉬워요. 이 습관을 미션과 리포트로 잡아갑니다.`},
  ];
  const s=slides[S.onb];
  app().innerHTML = `
  <div class="scr-tag">화면 <b>S0 · 온보딩</b> — 최초 1회 (수업연계 모드에선 W1 OT가 대체) &nbsp;|&nbsp; 엔진: <b>§3-B 명시 교수 층</b></div>
  <div class="card"><div class="eyebrow">${s.e}</div><h2>${s.h}</h2><div class="slide"><p style="font-size:15px;line-height:1.75">${s.b}</p></div>
    <div class="dots">${[0,1,2].map(i=>`<i class="${i===S.onb?'on':''}"></i>`).join('')}</div>
  </div>
  <div class="nav">
    <button class="btn ghost" ${S.onb===0?'disabled':''} onclick="S.onb--;render()">← 이전</button><div class="sp"></div>
    ${S.onb<2?`<button class="btn" onclick="S.onb++;render()">다음 →</button>`:`<button class="btn acc" onclick="go('diagnostic')">진단 시작 →</button>`}
  </div>`;
}

/* ── S1 진단 ── */
function vDiag(){
  app().innerHTML = `
  <div class="scr-tag">화면 <b>S1 · 진단</b> — 축약 미션 3개(요청·거절) → 초기 프로파일 · 수준 확인 &nbsp;|&nbsp; 엔진: <b>모듈 A 역방향(听声辨位)</b> + 초기 D 프로파일</div>
  <div class="card">
    <div class="eyebrow">진단 · 3개 중 1</div>
    <h2>이 메시지, 누가 누구에게 보낸 걸까요?</h2>
    <p class="lead">정답을 맞히는 게 아니라, 당신이 <b>단서를 어떻게 읽는지</b>를 보려는 거예요.</p>
    <div class="srcbox" style="font-family:var(--zh)">劳驾，能麻烦您把报告再确认一下吗？</div>
    <div class="q">이 사람과 상대는 어떤 사이로 보이나요?</div>
    <div class="opts">
      <button onclick="this.classList.add('sel')">친한 사이 · 편한 부탁</button>
      <button onclick="this.classList.add('sel')">거리가 있는 윗사람 · 정중한 부탁</button>

const GAME=[

const CLS_LABELS=[['under','너무 직접'],['ok','알맞음'],['over','과잉 공손']];

}

function mFix(){ if(!S.revised)S.revised=S.draft||M.demoDraft;

  return `<div class="card"><div class="eyebrow">한 곳 고치기</div><h2>딱 한 군데만 손봐요</h2>
  <div class="fixnote"><b>고칠 위치와 이유</b>부탁을 <b>여는 첫 부분</b>에 완충 표현이 하나 있으면 훨씬 편하게 읽혀요. ${tail}</div>
  <textarea id="rv">${S.revised}</textarea>
  <div class="thint">모범답안을 베끼지 않아도 돼요. 당신 문장에 완충 한 마디만.</div></div>`; }
function mCS(){ return `

function mDemo(){ if(S.m===0&&S.sel===null)S.sel=1; else if(S.m===1)S.draft=M.demoDraft; else if(S.m===3)S.revised='小林，不好意思，发表资料的截止日期能推迟一天吗？我这部分整理得有点慢~'; else if(S.m===4)S.cs='尊敬的X教授：您好！冒昧打扰，我想请问…'; render(); }
window.mDemo=mDemo;
